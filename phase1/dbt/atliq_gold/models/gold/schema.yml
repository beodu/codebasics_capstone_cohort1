version: 2

models:
  - name: fact_sales
    description: >
      Central fact table. Grain: one row per order item. Sum gross_revenue for
      revenue; filter is_revenue = true to exclude Cancelled orders.
    columns:
      - name: order_item_id
        description: Business key from the OLTP source. Guards the grain.
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        description: FK to dim_customer.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        description: FK to dim_product.
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: date_key
        description: FK to dim_date. Fails if an order date falls outside the calendar.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: quantity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
      - name: gross_revenue
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: status
        tests:
          - accepted_values:
              values: ['Placed', 'Shipped', 'Delivered', 'Cancelled', 'Returned']

  - name: dim_customer
    description: One row per customer, with signup cohort for new-vs-returning analysis.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: city
        tests: [not_null]
      - name: signup_date
        tests: [not_null]

  - name: dim_product
    description: Product catalog enriched with supplier cost and unit margin.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: unit_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: dim_date
    description: Generated calendar, one row per day.
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: fact_marketing_spend
    description: "Daily ad spend by channel. Grain: one row per day x channel x campaign."
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: spend_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
